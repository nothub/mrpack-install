name: '🧑‍🏭'
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
permissions:
  contents: write
jobs:

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true
      - run: go test -v -race -vet='all' ./...

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true
      - run: go test -v -race -tags e2e ./e2e/...

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') == true
    needs: [ check, e2e ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
